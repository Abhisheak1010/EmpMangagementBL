version: '3.8'
services:

  postgres:
    image: postgres:15
    container_name: ems_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5481
      POSTGRES_DB: EMPBL
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ems_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/EMPBL
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 5481
      JWT_SECRET: ThisIsAStrongSecretKeyForJWT1234
      JWT_EXPIRATION: 86400000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
